server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "${FRONTEND_ORIGIN:http://localhost:5173}"
              - "https://*.app.github.dev"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            maxAge: 3600
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
        - id: registration-service
          uri: lb://registration-service
          predicates:
            - Path=/api/registrations/**
        - id: certificate-service
          uri: lb://certificate-service
          predicates:
            - Path=/api/certificates/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: frontend-vite-websocket
          uri: "${FRONTEND_WS_URL:ws://localhost:5173}"
          order: 99
          predicates:
            - Path=/**
            - Header=Upgrade, websocket
        - id: frontend-vite
          uri: "${FRONTEND_URL:http://localhost:5173}"
          order: 100
          predicates:
            - Path=/**

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
